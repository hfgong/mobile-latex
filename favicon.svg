<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主背景：深邃极光蓝紫渐变，彰显现代感与数学严谨 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 柔和内发光层 -->
    <radialGradient id="innerGlow" cx="28%" cy="22%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </radialGradient>

    <!-- x² 亮蓝高光渐变 -->
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- 上标 ² 的明亮青色渐变 -->
    <linearGradient id="supGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- AI 灵感星芒渐变 -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- 柔和阴影与辉光滤镜 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#090d16" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / macOS 风格圆角底座 (Squircle) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGradient)" />
  <rect width="512" height="512" rx="118" fill="url(#innerGlow)" />
  <!-- 高光外描边，确保在任何深色/浅色浏览器标签栏上轮廓清晰 -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- 主图形组合 -->
  <g filter="url(#shadow)">
    <!-- 1. 左侧：标志性数学求和符号 ∑ (经典厚重字形) -->
    <path d="M 88 130 
             L 248 130 
             L 248 172 
             L 164 172 
             L 218 256 
             L 158 340 
             L 252 340 
             L 252 382 
             L 88 382 
             L 88 344 
             L 162 256 
             L 88 168 Z" 
          fill="#ffffff" />

    <!-- 2. 右侧主体：放大加粗、清晰夺目的数学变量 x -->
    <g transform="translate(262, 175)">
      <!-- 主对角笔画 (Top-left to Bottom-right) -->
      <path d="M 12 18 
               C 18 6, 32 0, 48 0 
               C 62 0, 78 12, 94 38 
               L 128 92 
               L 162 38 
               C 176 14, 192 0, 208 0 
               C 222 0, 234 8, 238 20 
               C 238 26, 230 36, 218 42 
               C 204 48, 194 54, 182 72 
               L 142 134 
               L 188 202 
               C 204 226, 216 234, 230 238 
               C 238 240, 242 248, 240 258 
               C 236 268, 222 276, 206 276 
               C 190 276, 174 262, 158 238 
               L 120 180 
               L 80 238 
               C 64 262, 48 276, 32 276 
               C 18 276, 6 268, 2 256 
               C 2 248, 10 240, 20 234 
               C 34 228, 46 220, 60 198 
               L 104 134 
               L 60 70 
               C 44 46, 32 38, 18 34 
               C 10 32, 6 24, 12 18 Z" 
            fill="url(#xGrad)" />
    </g>

    <!-- 3. 右上角：醒目上标 ² (显著放大加粗) -->
    <g transform="translate(382, 92)">
      <path d="M 12 40 
               C 12 16, 32 0, 62 0 
               C 92 0, 112 16, 112 38 
               C 112 56, 98 74, 76 96 
               L 42 130 
               L 114 130 
               L 114 158 
               L 10 158 
               L 10 134 
               L 54 88 
               C 70 70, 80 58, 80 44 
               C 80 30, 72 22, 58 22 
               C 44 22, 36 30, 36 44 
               C 36 50, 28 54, 20 54 
               C 12 54, 12 48, 12 40 Z" 
            fill="url(#supGrad)" />
    </g>

    <!-- 4. 底部右侧：代表 AI 智能协作的四角星芒 ✦ -->
    <path d="M 436 370 
             Q 436 410, 396 410 
             Q 436 410, 436 450 
             Q 436 410, 476 410 
             Q 436 410, 436 370 Z" 
          fill="url(#sparkleGrad)" 
          filter="url(#glow)" />
    <circle cx="482" cy="360" r="6" fill="#67e8f9" />
  </g>
</svg>
