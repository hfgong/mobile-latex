<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主背景渐变：深邃极光蓝紫渐变，彰显现代科技与数学严谨感 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 柔和内发光层 -->
    <radialGradient id="innerGlow" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </radialGradient>

    <!-- AI 灵感星芒发光渐变 -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- 图标高光与阴影滤镜 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / macOS 风格连续曲率圆角矩形 (Squircle) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGradient)" />
  <rect width="512" height="512" rx="118" fill="url(#innerGlow)" />
  <!-- 精致高光描边，确保在深色/浅色浏览器标签页均有清晰轮廓 -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- 主图形容器 -->
  <g filter="url(#shadow)">
    <!-- 1. 经典 LaTeX / 数学积分符 (∫) 优美曲线 -->
    <path d="M 200 130 
             C 170 130, 150 145, 150 175 
             C 150 195, 162 208, 178 208 
             C 192 208, 204 196, 204 182 
             C 204 172, 198 165, 188 163 
             C 194 154, 204 150, 216 150 
             C 234 150, 246 166, 246 198 
             C 246 220, 236 265, 218 325 
             C 194 402, 180 435, 180 460 
             C 180 490, 202 506, 234 506 
             C 266 506, 288 490, 288 460 
             C 288 440, 276 428, 260 428 
             C 246 428, 234 440, 234 454 
             C 234 464, 240 471, 250 473 
             C 244 482, 234 486, 222 486 
             C 204 486, 192 470, 192 438 
             C 192 416, 202 371, 220 311 
             C 244 234, 258 201, 258 176 
             C 258 146, 236 130, 200 130 Z" 
          fill="#ffffff" fill-opacity="0.3" transform="scale(0.72) translate(10, 45)" />

    <!-- 2. 标志性大写希腊字母 Sigma (∑) -->
    <path d="M 128 148 
             L 344 148 
             L 344 192 
             L 224 192 
             L 296 268 
             L 218 350 
             L 348 350 
             L 348 396 
             L 128 396 
             L 128 354 
             L 226 268 
             L 128 188 Z" 
          fill="#ffffff" />

    <!-- 3. 上标数学变量 x 与平方 ² 装饰 -->
    <g fill="#93c5fd" transform="translate(356, 138)">
      <!-- 字母 x -->
      <path d="M 14 36 L 2 54 L 14 54 L 22 42 L 30 54 L 42 54 L 30 36 L 41 20 L 29 20 L 22 30 L 15 20 L 3 20 Z" />
      <!-- 上标 2 -->
      <path d="M 48 24 L 62 24 L 62 27 L 54 36 L 63 36 L 63 39 L 48 39 L 48 36 L 56 27 L 48 27 Z" />
    </g>

    <!-- 4. 代表 AI 智能的灵感四角星芒 (✦) -->
    <path d="M 375 290 
             Q 375 340, 325 340 
             Q 375 340, 375 390 
             Q 375 340, 425 340 
             Q 375 340, 375 290 Z" 
          fill="url(#sparkleGrad)" 
          filter="url(#glow)" />
    
    <!-- 伴随微小星光 -->
    <circle cx="420" cy="275" r="7" fill="#67e8f9" />
    <circle cx="320" cy="405" r="5" fill="#c084fc" />
  </g>
</svg>
