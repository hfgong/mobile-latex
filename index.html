<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
    <title>Mobile LaTeX - Mobile LaTeX Editor for AI Math Chat</title>
    
    <!-- Mobile Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A mobile-first LaTeX equation composer and AI math chat companion. Fits naturally on phones.">
    
    <!-- Favicon (SVG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">

    <!-- KaTeX CSS & JS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --surface-active: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-text: #1d4ed8;
            --danger-color: #ef4444;
            --danger-light: #fef2f2;
            --success-color: #10b981;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, Monaco, monospace;
            --preview-font-size: 1.35rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #090d16;
                --surface-color: #131b2e;
                --surface-hover: #1e293b;
                --surface-active: #334155;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border-color: #1e293b;
                --primary-color: #3b82f6;
                --primary-hover: #60a5fa;
                --primary-light: #1e293b;
                --primary-text: #93c5fd;
                --danger-color: #f87171;
                --danger-light: #450a0a;
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            }
            .katex { color: var(--text-primary); }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 10px);
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
        }

        /* 顶部导航与语言切换 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-top {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 6px 10px;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
            min-height: 34px;
        }

        .btn-top:active {
            transform: scale(0.95);
            background: var(--surface-active);
        }

        /* 快捷模板栏 */
        .template-section {
            margin-bottom: 8px;
        }

        .template-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .template-scroll::-webkit-scrollbar { display: none; }

        .pill-template {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
        }

        .pill-template:active {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        /* 预览卡片 */
        .preview-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 12px;
            min-height: 140px;
            max-height: 280px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-sm);
            margin-bottom: 10px;
            transition: border-color 0.2s ease;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preview-controls {
            display: flex;
            gap: 4px;
        }

        .btn-zoom {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            width: 26px;
            height: 24px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-zoom:active {
            background: var(--surface-active);
        }

        .preview-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 6px;
            -webkit-overflow-scrolling: touch;
        }

        #preview-content {
            font-size: var(--preview-font-size);
            max-width: 100%;
            text-align: center;
            user-select: text;
        }

        .preview-card.has-error {
            border-color: var(--danger-color);
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-style: italic;
        }

        /* 错误浮条 */
        #error-banner {
            display: none;
            background: var(--danger-light);
            color: var(--danger-color);
            font-size: 0.8rem;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            font-family: var(--font-mono);
            word-break: break-all;
            line-height: 1.4;
        }

        /* 移动端专属虚拟键盘与工具箱 */
        .keyboard-wrapper {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 8px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
        }

        /* 分类切换 Tab */
        .tab-bar {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .tab-bar::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: var(--primary-light);
            color: var(--primary-text);
        }

        /* 符号网格 */
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 6px;
            max-height: 125px;
            overflow-y: auto;
            padding: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .key-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            height: 38px;
            font-size: 0.95rem;
            font-family: var(--font-mono);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
        }

        .key-btn:active {
            transform: scale(0.92);
            background: var(--primary-light);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* 光标移动与编辑控制条 */
        .cursor-bar {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border-color);
        }

        .cursor-btn {
            flex: 1;
            height: 36px;
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .cursor-btn:active {
            background: var(--surface-active);
            transform: scale(0.94);
        }

        .cursor-btn.danger {
            color: var(--danger-color);
        }

        /* LaTeX 输入框 */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            position: relative;
        }

        #latex-input {
            width: 100%;
            flex: 1;
            min-height: 110px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 0.98rem;
            line-height: 1.45;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            outline: none;
            resize: none;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #latex-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* 底部操作与 AI 助手栏 */
        .ai-actions-drawer {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .ai-actions-drawer::-webkit-scrollbar { display: none; }

        .ai-prompt-chip {
            background: var(--surface-color);
            border: 1px dashed var(--primary-color);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--primary-color);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .ai-prompt-chip:active {
            background: var(--primary-color);
            color: #ffffff;
        }

        .primary-actions {
            display: flex;
            gap: 8px;
            padding-bottom: 4px;
        }

        .btn-action {
            height: 46px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.12s ease;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-main {
            flex: 3;
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            flex: 2;
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .btn-danger {
            width: 46px;
            background: var(--surface-color);
            color: var(--danger-color);
            border: 1px solid var(--border-color);
        }

        /* 历史记录抽屉 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-sheet {
            background: var(--surface-color);
            width: 100%;
            max-width: 680px;
            max-height: 80vh;
            border-radius: 20px 20px 0 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            word-break: break-all;
        }

        .history-item:active {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        /* 浮动 Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            box-shadow: var(--shadow-md);
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header>
        <div class="brand">
            <span>📐</span>
            <span id="app-title">Mobile LaTeX</span>
        </div>
        <div class="header-actions">
            <button class="btn-top" id="lang-btn" aria-label="Toggle Language">
                <span>🌐</span>
                <span id="lang-label">中文</span>
            </button>
            <button class="btn-top" id="open-history-btn" aria-label="History">
                <span>🕒</span>
                <span id="history-label" data-i18n="history">历史</span>
            </button>
        </div>
    </header>

    <!-- 经典模板栏 -->
    <div class="template-section">
        <div class="template-scroll" id="template-bar">
            <!-- 动态生成模板药丸 -->
        </div>
    </div>

    <!-- 实时渲染预览区 -->
    <div class="preview-card" id="preview-card">
        <div class="preview-header">
            <span data-i18n="preview_title">实时预览</span>
            <div class="preview-controls">
                <button class="btn-zoom" id="zoom-out" title="缩小">−</button>
                <button class="btn-zoom" id="zoom-reset" title="重置">1x</button>
                <button class="btn-zoom" id="zoom-in" title="放大">+</button>
            </div>
        </div>
        <div class="preview-body">
            <div id="preview-content">
                <span class="placeholder-text" data-i18n="preview_placeholder">在此处实时预览渲染公式</span>
            </div>
        </div>
    </div>

    <!-- 语法错误提示 -->
    <div id="error-banner"></div>

    <!-- 移动端专属虚拟数学键盘 -->
    <div class="keyboard-wrapper">
        <!-- 分类切换 Tabs -->
        <div class="tab-bar" id="category-tabs">
            <button class="tab-btn active" data-cat="common" data-i18n="tab_common">常用</button>
            <button class="tab-btn" data-cat="calculus" data-i18n="tab_calculus">微积分/代数</button>
            <button class="tab-btn" data-cat="greek" data-i18n="tab_greek">希腊字母</button>
            <button class="tab-btn" data-cat="logic" data-i18n="tab_logic">集合/逻辑</button>
            <button class="tab-btn" data-cat="matrix" data-i18n="tab_matrix">括号/矩阵</button>
        </div>

        <!-- 符号键位网格 -->
        <div class="symbol-grid" id="symbol-grid">
            <!-- 动态填充 -->
        </div>

        <!-- 辅助光标控制条 (极大缓解手机编辑光标定位困难) -->
        <div class="cursor-bar">
            <button class="cursor-btn" id="btn-cursor-left">◀</button>
            <button class="cursor-btn" id="btn-cursor-right">▶</button>
            <button class="cursor-btn" id="btn-insert-space" data-i18n="key_space">空格</button>
            <button class="cursor-btn" id="btn-insert-quad">\quad</button>
            <button class="cursor-btn" id="btn-undo" title="Undo">↶</button>
            <button class="cursor-btn danger" id="btn-backspace">⌫</button>
        </div>
    </div>

    <!-- LaTeX 源代码输入框 -->
    <div class="editor-container">
        <textarea id="latex-input" 
                  placeholder="在此输入 LaTeX 公式代码..." 
                  data-i18n-ph="input_placeholder"
                  autocorrect="off" 
                  autocapitalize="off" 
                  spellcheck="false"></textarea>
    </div>

    <!-- AI 快捷提问词条 (专为 AI 数学问答设计) -->
    <div class="ai-actions-drawer" id="ai-actions-bar">
        <!-- 动态生成 AI Prompt 快捷复制 -->
    </div>

    <!-- 底部主操作按钮 -->
    <div class="primary-actions">
        <button class="btn-action btn-danger" id="btn-clear" title="清空">🗑</button>
        <button class="btn-action btn-secondary" id="btn-copy-md" data-i18n="btn_copy_md">
            复制 $$...$$
        </button>
        <button class="btn-action btn-main" id="btn-copy-latex" data-i18n="btn_copy_latex">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span data-i18n="btn_copy_raw">复制 LaTeX</span>
        </button>
    </div>

    <!-- 历史记录弹窗抽屉 -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal-sheet">
            <div class="modal-header">
                <span class="modal-title" data-i18n="history_modal_title">公式历史记录</span>
                <button class="modal-close" id="close-history-btn">&times;</button>
            </div>
            <div class="history-list" id="history-list">
                <!-- 历史项 -->
            </div>
        </div>
    </div>

    <!-- 消息提示 Toast -->
    <div id="toast"></div>

    <script>
        // ================= 国际化字典 (i18n Dictionary) =================
        const i18nData = {
            zh: {
                app_title: "Mobile LaTeX",
                lang_toggle: "English",
                history: "历史",
                preview_title: "实时渲染预览",
                preview_placeholder: "在下方键入 LaTeX，在此处实时预览渲染效果",
                tab_common: "常用运算",
                tab_calculus: "微积分/函数",
                tab_greek: "希腊字母",
                tab_logic: "集合/逻辑",
                tab_matrix: "括号/矩阵",
                key_space: "空格",
                input_placeholder: "在此输入 LaTeX 公式代码...",
                btn_copy_md: "复制 $$...$$",
                btn_copy_raw: "复制 LaTeX",
                btn_clear: "清空",
                history_modal_title: "最近公式历史",
                history_empty: "暂无历史记录",
                toast_copied_latex: "已复制 LaTeX 源码",
                toast_copied_md: "已复制 Markdown 公式 ($$...$$)",
                toast_copied_ai: "已复制并包装 AI 提示词",
                toast_cleared: "已清空",
                toast_loaded_template: "已载入公式模板",
                toast_empty: "内容为空，无需复制",
                toast_copy_fail: "复制失败，请长按文本复制",
                syntax_error: "语法提示: ",
                ai_prompts: [
                    { label: "💬 逐步解析", prefix: "请帮我一步一步详细推导和解释这个公式：\n$$\n", suffix: "\n$$" },
                    { label: "🧮 求解/化简", prefix: "请帮我求解或化简这个数学表达式，给出完整步骤：\n$$\n", suffix: "\n$$" },
                    { label: "📜 严谨证明", prefix: "请给出以下定理或公式的严密数学证明：\n$$\n", suffix: "\n$$" },
                    { label: "🔍 检查推导", prefix: "请检查以下公式与推导步骤是否存在逻辑漏洞或计算错误：\n$$\n", suffix: "\n$$" }
                ],
                templates: [
                    { name: "质能方程", code: "E = mc^2" },
                    { name: "正态分布", code: "f(x) = \\frac{1}{\\sigma \\sqrt{2\\pi}} e^{-\\frac{1}{2}\\left(\\frac{x-\\mu}{\\sigma}\\right)^2}" },
                    { name: "欧拉恒等式", code: "e^{i\\pi} + 1 = 0" },
                    { name: "高斯积分", code: "\\int_{-\\infty}^{+\\infty} e^{-x^2} dx = \\sqrt{\\pi}" },
                    { name: "矩阵求逆", code: "\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}^{-1} = \\frac{1}{ad-bc} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}" },
                    { name: "分段函数", code: "f(x) = \\begin{cases} x^2, & x \\geq 0 \\\\ -x, & x < 0 \\end{cases}" },
                    { name: "多行对齐", code: "\\begin{aligned} (a+b)^2 &= (a+b)(a+b) \\\\ &= a^2 + 2ab + b^2 \\end{aligned}" }
                ]
            },
            en: {
                app_title: "Mobile LaTeX",
                lang_toggle: "中文",
                history: "History",
                preview_title: "Live Preview",
                preview_placeholder: "Type LaTeX below to preview the rendered math here",
                tab_common: "Basic",
                tab_calculus: "Calculus",
                tab_greek: "Greek",
                tab_logic: "Sets/Logic",
                tab_matrix: "Brackets/Matrix",
                key_space: "Space",
                input_placeholder: "Type LaTeX formula code here...",
                btn_copy_md: "Copy $$...$$",
                btn_copy_raw: "Copy LaTeX",
                btn_clear: "Clear",
                history_modal_title: "Recent Formulas",
                history_empty: "No history yet",
                toast_copied_latex: "Copied LaTeX source",
                toast_copied_md: "Copied Markdown ($$...$$)",
                toast_copied_ai: "Copied with AI prompt",
                toast_cleared: "Cleared",
                toast_loaded_template: "Template loaded",
                toast_empty: "Empty formula, nothing to copy",
                toast_copy_fail: "Copy failed, please select and copy manually",
                syntax_error: "Syntax note: ",
                ai_prompts: [
                    { label: "💬 Explain Step-by-Step", prefix: "Please explain and derive this formula step by step:\n$$\n", suffix: "\n$$" },
                    { label: "🧮 Solve / Simplify", prefix: "Please solve or simplify this mathematical expression with full steps:\n$$\n", suffix: "\n$$" },
                    { label: "📜 Mathematical Proof", prefix: "Please provide a rigorous mathematical proof for:\n$$\n", suffix: "\n$$" },
                    { label: "🔍 Check Derivation", prefix: "Please review this formula and check for any calculation or reasoning errors:\n$$\n", suffix: "\n$$" }
                ],
                templates: [
                    { name: "Mass-Energy", code: "E = mc^2" },
                    { name: "Gaussian Distribution", code: "f(x) = \\frac{1}{\\sigma \\sqrt{2\\pi}} e^{-\\frac{1}{2}\\left(\\frac{x-\\mu}{\\sigma}\\right)^2}" },
                    { name: "Euler's Identity", code: "e^{i\\pi} + 1 = 0" },
                    { name: "Gaussian Integral", code: "\\int_{-\\infty}^{+\\infty} e^{-x^2} dx = \\sqrt{\\pi}" },
                    { name: "Matrix Inverse", code: "\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}^{-1} = \\frac{1}{ad-bc} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}" },
                    { name: "Piecewise Function", code: "f(x) = \\begin{cases} x^2, & x \\geq 0 \\\\ -x, & x < 0 \\end{cases}" },
                    { name: "Aligned Equations", code: "\\begin{aligned} (a+b)^2 &= (a+b)(a+b) \\\\ &= a^2 + 2ab + b^2 \\end{aligned}" }
                ]
            }
        };

        // ================= 符号键盘数据库 (Keypad Symbols Database) =================
        const symbolCategories = {
            common: [
                { display: "\\frac{a}{b}", snippet: "\\frac{$1}{$2}" },
                { display: "xⁿ", snippet: "^{$1}" },
                { display: "xₙ", snippet: "_{$1}" },
                { display: "\\sqrt{}", snippet: "\\sqrt{$1}" },
                { display: "\\pm", snippet: "\\pm " },
                { display: "\\times", snippet: "\\times " },
                { display: "\\div", snippet: "\\div " },
                { display: "\\neq", snippet: "\\neq " },
                { display: "\\leq", snippet: "\\leq " },
                { display: "\\geq", snippet: "\\geq " },
                { display: "\\approx", snippet: "\\approx " },
                { display: "\\infty", snippet: "\\infty " },
                { display: "=", snippet: " = " },
                { display: "+", snippet: " + " },
                { display: "-", snippet: " - " },
                { display: "\\cdot", snippet: "\\cdot " }
            ],
            calculus: [
                { display: "\\int", snippet: "\\int_{$1}^{$2} " },
                { display: "\\iint", snippet: "\\iint " },
                { display: "\\sum", snippet: "\\sum_{$1}^{$2} " },
                { display: "\\prod", snippet: "\\prod_{$1}^{$2} " },
                { display: "\\lim", snippet: "\\lim_{$1 \\to $2} " },
                { display: "\\frac{d}{dx}", snippet: "\\frac{d}{dx} " },
                { display: "\\partial", snippet: "\\partial " },
                { display: "\\nabla", snippet: "\\nabla " },
                { display: "\\vec{x}", snippet: "\\vec{$1}" },
                { display: "\\hat{x}", snippet: "\\hat{$1}" },
                { display: "\\bar{x}", snippet: "\\bar{$1}" },
                { display: "\\sqrt[n]{x}", snippet: "\\sqrt[$1]{$2}" },
                { display: "\\ln", snippet: "\\ln($1)" },
                { display: "\\log", snippet: "\\log_{$1}($2)" },
                { display: "\\sin", snippet: "\\sin($1)" },
                { display: "\\cos", snippet: "\\cos($1)" }
            ],
            greek: [
                { display: "\\alpha", snippet: "\\alpha" },
                { display: "\\beta", snippet: "\\beta" },
                { display: "\\gamma", snippet: "\\gamma" },
                { display: "\\delta", snippet: "\\delta" },
                { display: "\\epsilon", snippet: "\\epsilon" },
                { display: "\\theta", snippet: "\\theta" },
                { display: "\\lambda", snippet: "\\lambda" },
                { display: "\\mu", snippet: "\\mu" },
                { display: "\\pi", snippet: "\\pi" },
                { display: "\\sigma", snippet: "\\sigma" },
                { display: "\\tau", snippet: "\\tau" },
                { display: "\\phi", snippet: "\\phi" },
                { display: "\\omega", snippet: "\\omega" },
                { display: "\\Delta", snippet: "\\Delta" },
                { display: "\\Omega", snippet: "\\Omega" },
                { display: "\\Sigma", snippet: "\\Sigma" }
            ],
            logic: [
                { display: "\\in", snippet: "\\in " },
                { display: "\\notin", snippet: "\\notin " },
                { display: "\\subset", snippet: "\\subset " },
                { display: "\\subseteq", snippet: "\\subseteq " },
                { display: "\\cup", snippet: "\\cup " },
                { display: "\\cap", snippet: "\\cap " },
                { display: "\\forall", snippet: "\\forall " },
                { display: "\\exists", snippet: "\\exists " },
                { display: "\\implies", snippet: "\\implies " },
                { display: "\\iff", snippet: "\\iff " },
                { display: "\\mathbb{R}", snippet: "\\mathbb{R}" },
                { display: "\\mathbb{C}", snippet: "\\mathbb{C}" },
                { display: "\\mathbb{Z}", snippet: "\\mathbb{Z}" },
                { display: "\\mathbb{N}", snippet: "\\mathbb{N}" },
                { display: "\\emptyset", snippet: "\\emptyset" },
                { display: "\\because", snippet: "\\because " }
            ],
            matrix: [
                { display: "( )", snippet: "\\left( $1 \\right)" },
                { display: "[ ]", snippet: "\\left[ $1 \\right]" },
                { display: "{ }", snippet: "\\left\\{ $1 \\right\\}" },
                { display: "|x|", snippet: "\\left| $1 \\right|" },
                { display: "pmatrix", snippet: "\\begin{pmatrix}\n$1 & $2 \\\\\n$3 & $4\n\\end{pmatrix}" },
                { display: "bmatrix", snippet: "\\begin{bmatrix}\n$1 & $2 \\\\\n$3 & $4\n\\end{bmatrix}" },
                { display: "cases", snippet: "\\begin{cases}\n$1, & $2 \\\\\n$3, & $4\n\\end{cases}" },
                { display: "aligned", snippet: "\\begin{aligned}\n$1 &= $2 \\\\\n&= $3\n\\end{aligned}" }
            ]
        };

        // ================= 状态管理 (State Management) =================
        const STORAGE_KEY_CONTENT = 'mobile_latex_cached_content';
        const STORAGE_KEY_LANG = 'mobile_latex_lang';
        const STORAGE_KEY_HISTORY = 'mobile_latex_history';

        let currentLang = 'en';
        let currentCategory = 'common';
        let previewZoomLevel = 1.35;
        let undoStack = [];

        // DOM 元素引用
        const input = document.getElementById('latex-input');
        const previewContent = document.getElementById('preview-content');
        const previewCard = document.getElementById('preview-card');
        const errorBanner = document.getElementById('error-banner');
        const symbolGrid = document.getElementById('symbol-grid');
        const categoryTabs = document.getElementById('category-tabs');
        const templateBar = document.getElementById('template-bar');
        const aiActionsBar = document.getElementById('ai-actions-bar');
        const toast = document.getElementById('toast');
        const langBtn = document.getElementById('lang-btn');
        const langLabel = document.getElementById('lang-label');
        const historyModal = document.getElementById('history-modal');
        const historyList = document.getElementById('history-list');

        // ================= 语言初始化与更新 =================
        function initLanguage() {
            const savedLang = localStorage.getItem(STORAGE_KEY_LANG);
            if (savedLang) {
                currentLang = savedLang;
            } else {
                const sysLang = navigator.language || (navigator.languages && navigator.languages[0]) || 'en';
                currentLang = sysLang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
            }
            updateLanguageUI();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem(STORAGE_KEY_LANG, currentLang);
            updateLanguageUI();
        }

        function updateLanguageUI() {
            const t = i18nData[currentLang];
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
            langLabel.textContent = t.lang_toggle;

            // 批量更新 data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.textContent = t[key];
            });

            // 批量更新 placeholder
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.dataset.i18nPh;
                if (t[key]) el.setAttribute('placeholder', t[key]);
            });

            renderTemplates();
            renderAiActions();
            renderSymbols();
            renderLatex();
        }

        // ================= 渲染组件 =================
        function renderTemplates() {
            const t = i18nData[currentLang];
            templateBar.innerHTML = '';
            t.templates.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'pill-template';
                btn.innerHTML = `<span>✨</span><span>${item.name}</span>`;
                btn.addEventListener('click', () => {
                    saveHistory(input.value);
                    input.value = item.code;
                    renderLatex();
                    showToast(t.toast_loaded_template);
                });
                templateBar.appendChild(btn);
            });
        }

        function renderAiActions() {
            const t = i18nData[currentLang];
            aiActionsBar.innerHTML = '';
            t.ai_prompts.forEach(prompt => {
                const chip = document.createElement('button');
                chip.className = 'ai-prompt-chip';
                chip.textContent = prompt.label;
                chip.addEventListener('click', () => {
                    const val = input.value.trim();
                    if (!val) {
                        showToast(t.toast_empty);
                        return;
                    }
                    const fullPrompt = `${prompt.prefix}${val}${prompt.suffix}`;
                    copyToClipboard(fullPrompt, t.toast_copied_ai);
                });
                aiActionsBar.appendChild(chip);
            });
        }

        function renderSymbols() {
            const symbols = symbolCategories[currentCategory] || [];
            symbolGrid.innerHTML = '';
            symbols.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'key-btn';
                btn.textContent = item.display;
                btn.addEventListener('click', () => {
                    insertSnippet(item.snippet);
                });
                symbolGrid.appendChild(btn);
            });
        }

        // ================= KaTeX 渲染引擎 =================
        function renderLatex() {
            const val = input.value.trim();
            const t = i18nData[currentLang];

            // 本地缓存
            localStorage.setItem(STORAGE_KEY_CONTENT, input.value);

            if (!val) {
                previewContent.innerHTML = `<span class="placeholder-text">${t.preview_placeholder}</span>`;
                errorBanner.style.display = 'none';
                previewCard.classList.remove('has-error');
                return;
            }

            try {
                if (window.katex) {
                    katex.render(val, previewContent, {
                        displayMode: true,
                        throwOnError: true,
                        trust: true,
                        strict: false
                    });
                    errorBanner.style.display = 'none';
                    previewCard.classList.remove('has-error');
                }
            } catch (err) {
                previewCard.classList.add('has-error');
                errorBanner.style.display = 'block';
                errorBanner.textContent = t.syntax_error + (err.message || 'LaTeX Error');
            }
        }

        // ================= 智能输入与光标定位 =================
        function insertSnippet(snippet) {
            pushUndoState();
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;

            const firstPos = snippet.indexOf('$1');
            const processed = snippet.replace(/\$1/g, '').replace(/\$2/g, '').replace(/\$3/g, '').replace(/\$4/g, '');

            input.value = text.substring(0, start) + processed + text.substring(end);
            
            const targetCursor = start + (firstPos !== -1 ? firstPos : processed.length);
            input.focus();
            input.setSelectionRange(targetCursor, targetCursor);

            renderLatex();
        }

        function pushUndoState() {
            if (undoStack.length >= 20) undoStack.shift();
            undoStack.push(input.value);
        }

        function performUndo() {
            if (undoStack.length > 0) {
                input.value = undoStack.pop();
                renderLatex();
            }
        }

        // ================= 剪贴板与 Toast =================
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        async function copyToClipboard(text, successMsg) {
            const t = i18nData[currentLang];
            if (!text || text.trim() === '') {
                showToast(t.toast_empty);
                return;
            }
            saveHistory(input.value.trim());

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
                showToast(successMsg);
            } catch (err) {
                showToast(t.toast_copy_fail);
            }
        }

        // ================= 历史记录持久化 =================
        function saveHistory(code) {
            if (!code || !code.trim()) return;
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]');
            history = history.filter(item => item !== code);
            history.unshift(code);
            if (history.length > 15) history.pop();
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
        }

        function renderHistoryList() {
            const t = i18nData[currentLang];
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]');
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyList.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">${t.history_empty}</div>`;
                return;
            }

            history.forEach(code => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.textContent = code;
                item.addEventListener('click', () => {
                    input.value = code;
                    renderLatex();
                    historyModal.classList.remove('open');
                    showToast(t.toast_loaded_template);
                });
                historyList.appendChild(item);
            });
        }

        // ================= 事件绑定 =================
        document.addEventListener('DOMContentLoaded', () => {
            initLanguage();

            // 恢复上次编辑内容
            const cached = localStorage.getItem(STORAGE_KEY_CONTENT);
            if (cached) {
                input.value = cached;
            }

            // 监听输入
            input.addEventListener('input', () => {
                renderLatex();
            });

            // 切换语言
            langBtn.addEventListener('click', toggleLanguage);

            // 分类 Tab 点击
            categoryTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.tab-btn');
                if (tab && tab.dataset.cat) {
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.cat;
                    renderSymbols();
                }
            });

            // 光标与快捷操作栏
            document.getElementById('btn-cursor-left').addEventListener('click', () => {
                const pos = Math.max(0, input.selectionStart - 1);
                input.focus();
                input.setSelectionRange(pos, pos);
            });

            document.getElementById('btn-cursor-right').addEventListener('click', () => {
                const pos = Math.min(input.value.length, input.selectionStart + 1);
                input.focus();
                input.setSelectionRange(pos, pos);
            });

            document.getElementById('btn-insert-space').addEventListener('click', () => {
                insertSnippet(' ');
            });

            document.getElementById('btn-insert-quad').addEventListener('click', () => {
                insertSnippet('\\quad ');
            });

            document.getElementById('btn-undo').addEventListener('click', performUndo);

            document.getElementById('btn-backspace').addEventListener('click', () => {
                pushUndoState();
                const start = input.selectionStart;
                const end = input.selectionEnd;
                if (start === end && start > 0) {
                    input.value = input.value.substring(0, start - 1) + input.value.substring(end);
                    input.focus();
                    input.setSelectionRange(start - 1, start - 1);
                } else if (start !== end) {
                    input.value = input.value.substring(0, start) + input.value.substring(end);
                    input.focus();
                    input.setSelectionRange(start, start);
                }
                renderLatex();
            });

            // 底部主按钮
            document.getElementById('btn-copy-latex').addEventListener('click', () => {
                const t = i18nData[currentLang];
                copyToClipboard(input.value, t.toast_copied_latex);
            });

            document.getElementById('btn-copy-md').addEventListener('click', () => {
                const t = i18nData[currentLang];
                const val = input.value.trim();
                if (!val) {
                    showToast(t.toast_empty);
                    return;
                }
                copyToClipboard(`$$\n${val}\n$$`, t.toast_copied_md);
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                const t = i18nData[currentLang];
                if (input.value.trim()) {
                    saveHistory(input.value.trim());
                    pushUndoState();
                    input.value = '';
                    renderLatex();
                    showToast(t.toast_cleared);
                }
            });

            // 预览放大/缩小/重置
            document.getElementById('zoom-in').addEventListener('click', () => {
                previewZoomLevel = Math.min(2.5, previewZoomLevel + 0.2);
                document.documentElement.style.setProperty('--preview-font-size', `${previewZoomLevel}rem`);
            });

            document.getElementById('zoom-out').addEventListener('click', () => {
                previewZoomLevel = Math.max(0.85, previewZoomLevel - 0.2);
                document.documentElement.style.setProperty('--preview-font-size', `${previewZoomLevel}rem`);
            });

            document.getElementById('zoom-reset').addEventListener('click', () => {
                previewZoomLevel = 1.35;
                document.documentElement.style.setProperty('--preview-font-size', '1.35rem');
            });

            // 历史记录模态框
            document.getElementById('open-history-btn').addEventListener('click', () => {
                renderHistoryList();
                historyModal.classList.add('open');
            });

            document.getElementById('close-history-btn').addEventListener('click', () => {
                historyModal.classList.remove('open');
            });

            historyModal.addEventListener('click', (e) => {
                if (e.target === historyModal) {
                    historyModal.classList.remove('open');
                }
            });

            // 等待 KaTeX 载入完成后渲染
            const timer = setInterval(() => {
                if (window.katex) {
                    clearInterval(timer);
                    renderLatex();
                }
            }, 50);
        });
    </script>
