<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 
      Mobile-first Viewport configuration:
      - viewport-fit=cover: Ensures full-bleed rendering behind iPhone notches and home indicators.
      - maximum-scale=5.0: Allows accessibility zooming up to 500% to inspect small math scripts.
      - interactive-widget=resizes-content: Adjusts viewport dynamically when soft keyboard appears.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, interactive-widget=resizes-content">
    <title>Mobile LaTeX - Mobile LaTeX Editor for AI Math Chat</title>
    
    <!-- PWA & Mobile Web App Standalone Meta Tags (iOS Safari & Android Chrome) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A mobile-first LaTeX equation composer and AI math chat companion. Fits naturally on phones.">
    
    <!-- Favicon & Touch Icons (GitHub Pages Static Support) -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="manifest" href="manifest.json">

    <!-- KaTeX CSS & JS Library (Loaded via fast jsDelivr CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>

    <style>
        /* ==========================================================================
           1. CSS Design Tokens & Theme Variables (Light / Dark Mode)
           ========================================================================== */
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --surface-active: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-text: #1d4ed8;
            --danger-color: #ef4444;
            --danger-light: #fef2f2;
            --success-color: #10b981;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, Monaco, monospace;
            --font-narrow: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", "Arial Narrow", "PingFang SC", "Hiragino Sans GB", sans-serif;
            --preview-font-size: 1.35rem;
        }

        /* Dark mode palette overrides */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #090d16;
                --surface-color: #131b2e;
                --surface-hover: #1e293b;
                --surface-active: #334155;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border-color: #1e293b;
                --primary-color: #3b82f6;
                --primary-hover: #60a5fa;
                --primary-light: #1e293b;
                --primary-text: #93c5fd;
                --danger-color: #f87171;
                --danger-light: #450a0a;
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            }
            .katex { color: var(--text-primary); }
        }

        /* ==========================================================================
           2. Global Reset & Mobile Layout Scaffolding
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: max(8px, env(safe-area-inset-top));
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
            transition: padding 0.15s ease;
        }

        /* ==========================================================================
           3. Top Navigation & Language Switcher
           ========================================================================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 8px;
            width: 100%;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-logo {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(135deg, #4338ca 0%, #2563eb 50%, #0284c7 100%);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 800;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.3);
            flex-shrink: 0;
            user-select: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-top {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 6px 10px;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
            min-height: 32px;
        }

        .btn-top:active {
            transform: scale(0.95);
            background: var(--surface-active);
        }

        /* ==========================================================================
           4. Quick Preset Templates Bar (Horizontal Scroll)
           ========================================================================== */
        .template-section {
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .template-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .template-scroll::-webkit-scrollbar { display: none; }

        .pill-template {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
        }

        .pill-template:active {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background: var(--primary-light);
        }

        /* ==========================================================================
           5. Live Formula Preview Box with Zoom Controls
           ========================================================================== */
        .preview-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px 12px;
            min-height: 130px;
            max-height: 260px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-sm);
            margin-bottom: 8px;
            transition: border-color 0.2s ease, opacity 0.15s ease;
            flex-shrink: 0;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preview-controls {
            display: flex;
            gap: 4px;
        }

        .btn-zoom {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            width: 26px;
            height: 24px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-zoom:active {
            background: var(--surface-active);
        }

        .preview-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 4px;
            -webkit-overflow-scrolling: touch;
        }

        #preview-content {
            font-size: var(--preview-font-size);
            max-width: 100%;
            text-align: center;
            user-select: text;
        }

        .preview-card.has-error {
            border-color: var(--danger-color);
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-style: italic;
        }

        /* Error notification banner */
        #error-banner {
            display: none;
            background: var(--danger-light);
            color: var(--danger-color);
            font-size: 0.8rem;
            padding: 6px 10px;
            border-radius: var(--radius-md);
            margin-bottom: 6px;
            font-family: var(--font-mono);
            word-break: break-all;
            line-height: 1.35;
        }

        /* ==========================================================================
           6. Virtual Math Keypad & Touch-Optimized Symbol Grid
           ========================================================================== */
        .keyboard-wrapper {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 6px;
            margin-bottom: 8px;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        /* Category tabs */
        .tab-bar {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .tab-bar::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 5px 9px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: var(--primary-light);
            color: var(--primary-text);
        }

        /* Keypad grid with narrower condensed font */
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 5px;
            max-height: 118px;
            overflow-y: auto;
            padding: 1px;
            -webkit-overflow-scrolling: touch;
        }

        .key-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            height: 36px;
            font-size: 0.88rem;
            font-family: var(--font-narrow);
            font-weight: 500;
            letter-spacing: -0.35px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            padding: 0 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .key-btn:active {
            transform: scale(0.92);
            background: var(--primary-light);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* ==========================================================================
           7. LaTeX Code Editor Area
           ========================================================================== */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
            position: relative;
            min-height: 95px;
        }

        #latex-input {
            width: 100%;
            flex: 1;
            min-height: 95px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 0.98rem;
            line-height: 1.45;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            outline: none;
            resize: none;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #latex-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* ==========================================================================
           8. Primary Actions & Split Dropdown Button
           ========================================================================== */
        .primary-actions {
            display: flex;
            gap: 8px;
            padding-bottom: 2px;
            flex-shrink: 0;
        }

        .btn-action {
            height: 44px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.12s ease;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            flex: 1;
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .btn-new {
            width: 44px;
            background: var(--surface-color);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
        }

        .btn-new:active {
            background: var(--surface-active);
            transform: scale(0.94);
        }

        .btn-new svg {
            color: var(--primary-color);
        }

        /* Split Button Group for Copy LaTeX & AI Prompt Dropdown */
        .split-btn-group {
            display: flex;
            position: relative;
            flex: 1.5;
            height: 44px;
            box-shadow: var(--shadow-md);
            border-radius: var(--radius-md);
        }

        .split-main {
            flex: 1;
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-top-left-radius: var(--radius-md);
            border-bottom-left-radius: var(--radius-md);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 0 8px;
            transition: background 0.12s ease;
        }

        .split-main:active {
            background: var(--primary-hover);
        }

        .split-divider {
            width: 1px;
            background: rgba(255, 255, 255, 0.25);
        }

        .split-arrow {
            width: 36px;
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-top-right-radius: var(--radius-md);
            border-bottom-right-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s ease;
        }

        .split-arrow:active, .split-arrow.open {
            background: var(--primary-hover);
        }

        /* Dropdown Menu Popup (Anchored Above the Button) */
        .dropdown-menu {
            position: absolute;
            bottom: calc(100% + 8px);
            right: 0;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 6px;
            min-width: 230px;
            display: none;
            flex-direction: column;
            gap: 3px;
            z-index: 500;
            backdrop-filter: blur(12px);
            animation: dropdownSlideUp 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dropdown-menu.show {
            display: flex;
        }

        @keyframes dropdownSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-header {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            padding: 6px 10px 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2px;
        }

        .dropdown-item {
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.1s ease;
        }

        .dropdown-item:active {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        /* ==========================================================================
           9. Soft Keyboard Focus Mode (Hides Preview Area To Save Vertical Space)
           ========================================================================== */
        body.keyboard-active .preview-card,
        body.keyboard-active .template-section {
            display: none !important;
        }

        body.keyboard-active .symbol-grid {
            max-height: 140px;
        }

        body.keyboard-active .editor-container {
            min-height: 120px;
        }

        /* ==========================================================================
           10. History Modal & Floating Toast Notification
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-sheet {
            background: var(--surface-color);
            width: 100%;
            max-width: 680px;
            max-height: 80vh;
            border-radius: 20px 20px 0 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            word-break: break-all;
        }

        .history-item:active {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        /* Floating Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            box-shadow: var(--shadow-md);
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header>
        <div class="brand">
            <span class="brand-logo">∑</span>
            <span id="app-title">Mobile LaTeX</span>
        </div>
        <div class="header-actions">
            <!-- Language Toggle Button (EN / 中文) -->
            <button class="btn-top" id="lang-btn" aria-label="Toggle Language">
                <span>🌐</span>
                <span id="lang-label">中文</span>
            </button>
            <!-- History Drawer Trigger Button -->
            <button class="btn-top" id="open-history-btn" aria-label="History">
                <span>🕒</span>
                <span id="history-label" data-i18n="history">历史</span>
            </button>
        </div>
    </header>

    <!-- Formula Templates Bar (Horizontal Scrollable) -->
    <div class="template-section">
        <div class="template-scroll" id="template-bar">
            <!-- Populated dynamically based on selected language -->
        </div>
    </div>

    <!-- Live KaTeX Preview Section (Automatically hidden when typing to maximize screen height) -->
    <div class="preview-card" id="preview-card">
        <div class="preview-header">
            <span data-i18n="preview_title">实时预览</span>
            <div class="preview-controls">
                <button class="btn-zoom" id="zoom-out" title="Zoom Out">−</button>
                <button class="btn-zoom" id="zoom-reset" title="Reset Zoom">1x</button>
                <button class="btn-zoom" id="zoom-in" title="Zoom In">+</button>
            </div>
        </div>
        <div class="preview-body">
            <div id="preview-content">
                <span class="placeholder-text" data-i18n="preview_placeholder">在此处实时预览渲染公式</span>
            </div>
        </div>
    </div>

    <!-- KaTeX Syntax Error Banner -->
    <div id="error-banner"></div>

    <!-- Virtual Mathematical Keypad (Symbols Stay 100% In View When Keyboard Opens) -->
    <div class="keyboard-wrapper">
        <!-- Category Navigation Tabs -->
        <div class="tab-bar" id="category-tabs">
            <button class="tab-btn active" data-cat="common" data-i18n="tab_common">常用</button>
            <button class="tab-btn" data-cat="calculus" data-i18n="tab_calculus">微积分/代数</button>
            <button class="tab-btn" data-cat="greek" data-i18n="tab_greek">希腊字母</button>
            <button class="tab-btn" data-cat="logic" data-i18n="tab_logic">集合/逻辑</button>
            <button class="tab-btn" data-cat="matrix" data-i18n="tab_matrix">括号/矩阵</button>
        </div>

        <!-- Symbol Grid Buttons (Narrow Font Stack) -->
        <div class="symbol-grid" id="symbol-grid">
            <!-- Populated dynamically based on active category tab -->
        </div>
    </div>

    <!-- LaTeX Code Editor Textarea -->
    <div class="editor-container">
        <textarea id="latex-input" 
                  placeholder="在此输入 LaTeX 公式代码..." 
                  data-i18n-ph="input_placeholder"
                  autocorrect="off" 
                  autocapitalize="off" 
                  spellcheck="false"></textarea>
    </div>

    <!-- Primary Action Controls with Compact Split Dropdown -->
    <div class="primary-actions">

    <!-- Floating Toast Feedback -->

    <script>

                toast_empty: "Empty formula, nothing to copy",

                    { name: "Euler's Identity", code: "e^{i\\pi} + 1 = 0" },
                    { name: "Gaussian Integral", code: "\\int_{-\\infty}^{+\\infty} e^{-x^2} dx = \\sqrt{\\pi}" },
                    { name: "Matrix Inverse", code: "\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}^{-1} = \\frac{1}{ad-bc} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}" },

        /**

         * Symbols grouped by mathematical categories with $1, $2 placeholders.
         * =========================================================================
         */
        const symbolCategories = {
            common: [
                { display: "\\frac{a}{b}", snippet: "\\frac{$1}{$2}" },

                { display: "xₙ", snippet: "_{$1}" },
                { display: "\\sqrt{}", snippet: "\\sqrt{$1}" },

                { display: "\\\\", snippet: " \\\\\n$1" },

                { display: "\\neq", snippet: "\\neq " },

            ],

                { display: "\\partial", snippet: "\\partial " },
                { display: "\\nabla", snippet: "\\nabla " },
                { display: "\\vec{x}", snippet: "\\vec{$1}" },
                { display: "\\hat{x}", snippet: "\\hat{$1}" },
                { display: "\\bar{x}", snippet: "\\bar{$1}" },
                { display: "\\sqrt[n]{x}", snippet: "\\sqrt[$1]{$2}" },
                { display: "\\ln", snippet: "\\ln($1)" },
                { display: "\\log", snippet: "\\log_{$1}($2)" },
                { display: "\\sin", snippet: "\\sin($1)" },
                { display: "\\cos", snippet: "\\cos($1)" }
            ],
            greek: [
                { display: "\\alpha", snippet: "\\alpha" },
                { display: "\\beta", snippet: "\\beta" },
                { display: "\\gamma", snippet: "\\gamma" },
                { display: "\\delta", snippet: "\\delta" },

                { display: "\\tau", snippet: "\\tau" },
                { display: "\\phi", snippet: "\\phi" },
                { display: "\\omega", snippet: "\\omega" },
                { display: "\\Delta", snippet: "\\Delta" },
                { display: "\\Omega", snippet: "\\Omega" },
                { display: "\\Sigma", snippet: "\\Sigma" }
            ],
            logic: [
                { display: "\\in", snippet: "\\in " },
                { display: "\\notin", snippet: "\\notin " },
                { display: "\\subset", snippet: "\\subset " },
                { display: "\\subseteq", snippet: "\\subseteq " },
                { display: "\\cup", snippet: "\\cup " },
                { display: "\\cap", snippet: "\\cap " },
                { display: "\\forall", snippet: "\\forall " },
                { display: "\\exists", snippet: "\\exists " },

                { display: "\\iff", snippet: "\\iff " },
                { display: "\\mathbb{R}", snippet: "\\mathbb{R}" },

                { display: "\\mathbb{Z}", snippet: "\\mathbb{Z}" },
                { display: "\\mathbb{N}", snippet: "\\mathbb{N}" },
                { display: "\\emptyset", snippet: "\\emptyset" },
                { display: "\\because", snippet: "\\because " }
            ],
            matrix: [
                { display: "( )", snippet: "\\left( $1 \\right)" },
                { display: "[ ]", snippet: "\\left[ $1 \\right]" },
                { display: "{ }", snippet: "\\left\\{ $1 \\right\\}" },
                { display: "|x|", snippet: "\\left| $1 \\right|" },
                { display: "pmatrix", snippet: "\\begin{pmatrix}\n$1 & $2 \\\\\n$3 & $4\n\\end{pmatrix}" },
                { display: "bmatrix", snippet: "\\begin{bmatrix}\n$1 & $2 \\\\\n$3 & $4\n\\end{bmatrix}" },
                { display: "cases", snippet: "\\begin{cases}\n$1, & $2 \\\\\n$3, & $4\n\\end{cases}" },
                { display: "aligned", snippet: "\\begin{aligned}\n$1 &= $2 \\\\\n&= $3\n\\end{aligned}" }
            ]
        };

        /**
         * =========================================================================
         * Module 3: Application State & LocalStorage Keys
         * =========================================================================
         */
        const STORAGE_KEY_CONTENT = 'mobile_latex_cached_content'; // Auto-saved draft
        const STORAGE_KEY_LANG = 'mobile_latex_lang';             // User language preference
        const STORAGE_KEY_HISTORY = 'mobile_latex_history';       // 15-item history queue

        let currentLang = 'en';
        let currentCategory = 'common';
        let previewZoomLevel = 1.35;
        let undoStack = [];

        // Cached DOM Elements
        const input = document.getElementById('latex-input');
        const previewContent = document.getElementById('preview-content');
        const previewCard = document.getElementById('preview-card');
        const errorBanner = document.getElementById('error-banner');
        const symbolGrid = document.getElementById('symbol-grid');
        const categoryTabs = document.getElementById('category-tabs');
        const templateBar = document.getElementById('template-bar');
        const aiDropdownMenu = document.getElementById('ai-dropdown-menu');
        const aiDropdownItems = document.getElementById('ai-dropdown-items');
        const btnAiDropdown = document.getElementById('btn-ai-dropdown');
        const toast = document.getElementById('toast');
        const langBtn = document.getElementById('lang-btn');
        const langLabel = document.getElementById('lang-label');
        const historyModal = document.getElementById('history-modal');
        const historyList = document.getElementById('history-list');

        /**
         * =========================================================================
         * Module 4: Internationalization Engine
         * Detects system language and updates all UI strings and templates.
         * =========================================================================
         */
        function initLanguage() {
            const savedLang = localStorage.getItem(STORAGE_KEY_LANG);
            if (savedLang) {
                currentLang = savedLang;
            } else {
                const sysLang = navigator.language || (navigator.languages && navigator.languages[0]) || 'en';
                currentLang = sysLang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
            }
            updateLanguageUI();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem(STORAGE_KEY_LANG, currentLang);
            updateLanguageUI();
        }

        function updateLanguageUI() {
            const t = i18nData[currentLang];
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
            langLabel.textContent = t.lang_toggle;

            // Batch update all data-i18n text nodes
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.textContent = t[key];
            });

            // Batch update all placeholder attributes
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.dataset.i18nPh;
                if (t[key]) el.setAttribute('placeholder', t[key]);
            });

            renderTemplates();
            renderAiDropdownOptions();
            renderSymbols();
            renderLatex();
        }

        /**
         * =========================================================================
         * Module 5: Component Renderers
         * =========================================================================
         */
        function renderTemplates() {
            const t = i18nData[currentLang];
            templateBar.innerHTML = '';
            t.templates.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'pill-template';
                btn.innerHTML = `<span>✨</span><span>${item.name}</span>`;
                btn.addEventListener('click', () => {
                    saveHistory(input.value); // Archive previous formula to history
                    input.value = item.code;
                    renderLatex();
                    showToast(t.toast_loaded_template);
                });
                templateBar.appendChild(btn);
            });
        }

        function renderAiDropdownOptions() {
            const t = i18nData[currentLang];
            aiDropdownItems.innerHTML = '';
            t.ai_prompts.forEach(prompt => {
                const item = document.createElement('button');
                item.className = 'dropdown-item';
                item.textContent = prompt.label;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    aiDropdownMenu.classList.remove('show');
                    btnAiDropdown.classList.remove('open');
                    
                    const val = input.value.trim();
                    if (!val) {
                        showToast(t.toast_empty);
                        return;
                    }
                    const fullPrompt = `${prompt.prefix}${val}${prompt.suffix}`;
                    copyToClipboard(fullPrompt, t.toast_copied_ai);
                });
                aiDropdownItems.appendChild(item);
            });
        }

        function renderSymbols() {
            const symbols = symbolCategories[currentCategory] || [];
            symbolGrid.innerHTML = '';
            symbols.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'key-btn';
                btn.textContent = item.display;
                btn.addEventListener('click', () => {
                    insertSnippet(item.snippet);
                });
                symbolGrid.appendChild(btn);
            });
        }

        /**
         * =========================================================================
         * Module 6: KaTeX Real-time Math Rendering Engine
         * =========================================================================
         */
        function renderLatex() {
            const val = input.value.trim();
            const t = i18nData[currentLang];

            // Auto-persist draft to localStorage
            localStorage.setItem(STORAGE_KEY_CONTENT, input.value);

            if (!val) {
                previewContent.innerHTML = `<span class="placeholder-text">${t.preview_placeholder}</span>`;
                errorBanner.style.display = 'none';
                previewCard.classList.remove('has-error');
                return;
            }

            try {
                if (window.katex) {
                    katex.render(val, previewContent, {
                        displayMode: true,
                        throwOnError: true,
                        trust: true,
                        strict: false
                    });
                    errorBanner.style.display = 'none';
                    previewCard.classList.remove('has-error');
                }
            } catch (err) {
                previewCard.classList.add('has-error');
                errorBanner.style.display = 'block';
                errorBanner.textContent = t.syntax_error + (err.message || 'LaTeX Error');
            }
        }

        /**
         * =========================================================================
         * Module 7: Smart Snippet Insertion & Cursor Repositioning
         * =========================================================================
         */
        function insertSnippet(snippet) {
            pushUndoState();
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;

            // Locate $1 placeholder for smart cursor placement
            const firstPos = snippet.indexOf('$1');
            const processed = snippet.replace(/\$1/g, '').replace(/\$2/g, '').replace(/\$3/g, '').replace(/\$4/g, '');

            input.value = text.substring(0, start) + processed + text.substring(end);
            
            const targetCursor = start + (firstPos !== -1 ? firstPos : processed.length);
            input.focus();
            input.setSelectionRange(targetCursor, targetCursor);

            renderLatex();
        }

        function pushUndoState() {
            if (undoStack.length >= 20) undoStack.shift();
            undoStack.push(input.value);
        }

        /**
         * =========================================================================
         * Module 8: Clipboard API & Non-blocking Toast Feedback
         * =========================================================================
         */
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        async function copyToClipboard(text, successMsg) {
            const t = i18nData[currentLang];
            if (!text || text.trim() === '') {
                showToast(t.toast_empty);
                return;
            }
            saveHistory(input.value.trim());

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
                showToast(successMsg);
            } catch (err) {
                showToast(t.toast_copy_fail);
            }
        }

        /**
         * =========================================================================
         * Module 9: History Storage & FIFO Queue
         * =========================================================================
         */
        function saveHistory(code) {
            if (!code || !code.trim()) return;
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]');
            history = history.filter(item => item !== code); // Deduplicate
            history.unshift(code); // Push to the top
            if (history.length > 15) history.pop();
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
        }

        function renderHistoryList() {
            const t = i18nData[currentLang];
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]');
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyList.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-secondary);">${t.history_empty}</div>`;
                return;
            }

            history.forEach(code => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.textContent = code;
                item.addEventListener('click', () => {
                    input.value = code;
                    renderLatex();
                    historyModal.classList.remove('open');
                    showToast(t.toast_loaded_template);
                });
                historyList.appendChild(item);
            });
        }

        /**
         * =========================================================================
         * Module 10: Event Bindings & Mobile Viewport Handling
         * =========================================================================
         */
        document.addEventListener('DOMContentLoaded', () => {
            initLanguage();

            // Restore cached draft from previous session
            const cached = localStorage.getItem(STORAGE_KEY_CONTENT);
            if (cached) {
                input.value = cached;
            }

            // Real-time typing listener
            input.addEventListener('input', () => {
                renderLatex();
            });

            // -------------------------------------------------------------
            // Soft Keyboard Viewport Adaptation (Hides preview while typing)
            // -------------------------------------------------------------
            input.addEventListener('focus', () => {
                document.body.classList.add('keyboard-active');
            });

            input.addEventListener('blur', () => {
                // Delay slightly in case focus moves to a symbol button
                setTimeout(() => {
                    if (document.activeElement !== input) {
                        document.body.classList.remove('keyboard-active');
                        renderLatex(); // Re-render to ensure latest preview is up-to-date
                    }
                }, 100);
            });

            // Language switch event
            langBtn.addEventListener('click', toggleLanguage);

            // Tab switching for symbol keypad
            categoryTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.tab-btn');
                if (tab && tab.dataset.cat) {
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.cat;
                    renderSymbols();
                }
            });

            // Split dropdown button toggle
            btnAiDropdown.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = aiDropdownMenu.classList.toggle('show');
                btnAiDropdown.classList.toggle('open', isOpen);
            });

            // Close dropdown menu on click outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.split-btn-group')) {
                    aiDropdownMenu.classList.remove('show');
                    btnAiDropdown.classList.remove('open');
                }
            });

            // Bottom action buttons
            document.getElementById('btn-copy-latex').addEventListener('click', () => {
                const t = i18nData[currentLang];
                copyToClipboard(input.value, t.toast_copied_latex);
            });

            document.getElementById('btn-copy-md').addEventListener('click', () => {
                const t = i18nData[currentLang];
                const val = input.value.trim();
                if (!val) {
                    showToast(t.toast_empty);
                    return;
                }
                copyToClipboard(`$$\n${val}\n$$`, t.toast_copied_md);
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                const t = i18nData[currentLang];
                if (input.value.trim()) {
                    saveHistory(input.value.trim()); // Backup before clearing
                    pushUndoState();
                    input.value = '';
                    renderLatex();
                    showToast(t.toast_cleared);
                }
            });

            // Preview zoom controls
            document.getElementById('zoom-in').addEventListener('click', () => {
                previewZoomLevel = Math.min(2.5, previewZoomLevel + 0.2);
                document.documentElement.style.setProperty('--preview-font-size', `${previewZoomLevel}rem`);
            });

            document.getElementById('zoom-out').addEventListener('click', () => {
                previewZoomLevel = Math.max(0.85, previewZoomLevel - 0.2);
                document.documentElement.style.setProperty('--preview-font-size', `${previewZoomLevel}rem`);
            });

            document.getElementById('zoom-reset').addEventListener('click', () => {
                previewZoomLevel = 1.35;
                document.documentElement.style.setProperty('--preview-font-size', '1.35rem');
            });

            // History modal triggers
            document.getElementById('open-history-btn').addEventListener('click', () => {
                renderHistoryList();
                historyModal.classList.add('open');
            });

            document.getElementById('close-history-btn').addEventListener('click', () => {
                historyModal.classList.remove('open');
            });

            historyModal.addEventListener('click', (e) => {
                if (e.target === historyModal) {
                    historyModal.classList.remove('open');
                }
            });

            // Polling check for KaTeX script initialization
            const timer = setInterval(() => {
                if (window.katex) {
                    clearInterval(timer);
                    renderLatex();
                }
            }, 50);
        });
    </script>
</body>
</html>
